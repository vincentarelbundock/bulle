title = "Node"
description = "Node.js runtime, npm, and package caches"
inherits = ["tool", "terminal"]
rox = [
  "?pkg:node",
  "?which:npm",
  "?which:npx",
  "?which:corepack",
  "$HOME/.nvm/versions/node/*/bin",
]
ro = ["?$HOME/.npmrc"]
# npm reports its own cache location, which respects npmrc and
# npm_config_cache; the literal path is the fallback when npm is absent.
rw = [
  "?+npm:cache",
  "?+${npm_config_cache:-$HOME/.npm}/",
]
env = ["NODE_ENV", "NODE_OPTIONS", "NVM_DIR", "npm_config_cache"]
