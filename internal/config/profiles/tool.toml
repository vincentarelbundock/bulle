title = "Tool"
description = "general local command support (PATH, executables, libs)"
inherits = "network"
# Runtime probes that numeric and threaded runtimes (OpenMP, BLAS, malloc
# tuning) read on startup. Read-only and information-only.
ro = [
  "?/proc/stat",
  "?/proc/cpuinfo",
  "?/proc/sys/vm/overcommit_memory",
  "?/sys/devices/system/cpu",
  "?/sys/kernel/mm/transparent_hugepage",
  "?/sys/fs/cgroup",
  "?/usr/share/zoneinfo",
  "?/etc/zoneinfo",
  "?/etc/localtime",
  "?/etc/os-release",
  "?/usr/lib/locale/locale-archive",
  "?/run/current-system/sw/lib/locale/locale-archive",
]
# system(3) and popen(3) hardcode /bin/sh; nearly every tool shells out
# through it at some point. The nix-ld directory is NixOS's loader shim for
# foreign binaries (rustup toolchains, downloaded tools): a farm of symlinks
# into store items that the add_libs scan follows and grants.
rox = ["?/bin/sh", "?which:bash", "?/run/current-system/sw/share/nix-ld/lib"]
rw = ["$TMP/bulle/tmp", "?/dev/null", "?/dev/tty"]
env = ["PATH", "NIX_LD", "NIX_LD_LIBRARY_PATH", "LD_LIBRARY_PATH"]
add_exec = true
add_libs = true
