title = "Tool"
description = "general local command support (PATH, executables, libs)"
inherits = "network"
# Runtime probes that numeric and threaded runtimes (OpenMP, BLAS, malloc
# tuning) read on startup. Read-only and information-only.
ro = [
  "?/proc/stat",
  "?/proc/cpuinfo",
  "?/proc/meminfo",
  "?/proc/sys/kernel/osrelease",
  "?/proc/sys/vm/overcommit_memory",
  "?/proc/sys/vm/max_map_count",
  "?/sys/devices/system/cpu",
  "?/sys/kernel/mm/transparent_hugepage",
  "?/sys/fs/cgroup",
  "?/usr/share/zoneinfo",
  "?/etc/zoneinfo",
  "?/etc/localtime",
  "?/etc/os-release",
  "?/usr/lib/locale/locale-archive",
  "?/run/current-system/sw/lib/locale/locale-archive",
  # The macOS equivalents of the probes above: dyld resolves the shared cache
  # through the cryptex mounts, CoreFoundation reads the text encoding and the
  # global preference domains on every process start, and libc opens the dtrace
  # and autofs helpers. All are information-only, and a denial on them is a
  # silent behaviour change rather than a clean error.
  "?/System/Cryptexes/App",
  "?/System/Cryptexes/OS",
  "?~/.CFUserTextEncoding",
  "?/Library/Preferences/.GlobalPreferences.plist",
  "?~/Library/Preferences/.GlobalPreferences.plist",
  "?~/Library/Preferences/.GlobalPreferences_m.plist",
  # Host-scoped preferences carry the machine UUID in the filename; the glob
  # keeps the grant to that one domain instead of the whole ByHost directory.
  "~/Library/Preferences/ByHost/.GlobalPreferences.*.plist",
  "?/dev/autofs_nowait",
]
# system(3) and popen(3) hardcode /bin/sh; nearly every tool shells out
# through it at some point. The nix-ld directory is NixOS's loader shim for
# foreign binaries (rustup toolchains, downloaded tools): a farm of symlinks
# into store items that the add_libs scan follows and grants.
# The which: entries are the coreutils staples that launcher scripts call by
# bare name (R's wrapper probes with uname and sed, quarto's uses dirname and
# basename, R cleans its session temp with rm). Granting them here gives
# every tool profile a working wrapper-script baseline.
rox = [
  "?/bin/sh",
  "?which:bash",
  "?which:env",
  "?which:uname",
  "?which:sed",
  "?which:dirname",
  "?which:basename",
  "?which:rm",
  "?/run/current-system/sw/share/nix-ld/lib",
]
# libc opens /dev/dtracehelper read-write during process startup on macOS, so a
# read-only grant is not enough to keep the probe quiet.
rw = ["$TMP/bulle/tmp", "?/dev/null", "?/dev/tty", "?/dev/dtracehelper"]
env = ["PATH", "NIX_LD", "NIX_LD_LIBRARY_PATH", "LD_LIBRARY_PATH"]
add_exec = true
add_libs = true
