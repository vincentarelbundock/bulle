title = "macOS developer tools"
description = "the active Xcode or Command Line Tools developer directory"
# Anything that compiles or links on macOS goes through /usr/bin/cc, which is a
# stub that asks xcode-select and xcrun where the real toolchain lives and then
# execs it out of the developer directory. The directory is version-stamped
# (/Applications/Xcode_26.6.app/... on CI runners, /Library/Developer/
# CommandLineTools on a bare install), so it is resolved rather than written
# down: a hardcoded path breaks on the next Xcode bump.
# Optional throughout: on Linux there is no xcode-select and every entry drops
# out, which is what lets tool profiles inherit this unconditionally.
# xcrun refuses to dispatch until it has stat'd the enclosing bundle's
# Info.plist and read the frameworks beside it, so the bundle is granted as
# well as the developer directory inside it. On a Command Line Tools install
# xcode:app reports nothing and only the developer directory is granted.
rox = ["?xcode:developer", "?xcode:app", "?which:xcode-select", "?which:xcrun"]
