title = "Rust"
description = "cargo, rustup toolchains, and the registry cache"
# git: cargo reads git configuration and shells out to git for git
# dependencies and vcs metadata.
inherits = ["tool", "terminal", "git", "macos-devtools"]
# cc and ld are rustc's link step; on wrapper-based systems (Nix, Homebrew
# gcc) they are scripts whose referenced store paths the add_libs scan grants.
rox = [
  "${CARGO_HOME:-~/.cargo}/bin",
  "?${RUSTUP_HOME:-~/.rustup}",
  "?which:cargo",
  "?which:rustc",
  "?which:cc",
  "?which:ld",
]
# cargo run and cargo test exec what they build.
rwx = ["?+$WORKSPACE/target/"]
ro = ["?${CARGO_HOME:-~/.cargo}/config.toml"]
rw = [
  "+${CARGO_HOME:-~/.cargo}/registry/",
  "+${CARGO_HOME:-~/.cargo}/git/",
  "?+${CARGO_HOME:-~/.cargo}/.global-cache",
  # cargo takes these lock files before it touches the registry or the shared
  # cache, and creates them on a cold home, so they are granted rather than
  # merely allowed to exist.
  "?+${CARGO_HOME:-~/.cargo}/.package-cache",
  "?+${CARGO_HOME:-~/.cargo}/.package-cache-mutate",
  "?+${CARGO_HOME:-~/.cargo}/.global-cache-journal",
]
env = ["CARGO_HOME", "RUSTUP_HOME", "RUSTFLAGS"]
