title = "Claude"
description = "Claude Code app state, config, and login support"
inherits = ["tool", "terminal", "git", "node"]
default_app = "claude"
rw = [
  "+$HOME/.claude.json",
]
rwx = [
  "+$HOME/.claude/",
  # Claude Code uses ~/.local/share on every platform rather than the macOS
  # convention, so this stays literal. The $DATA spelling is granted too when
  # it exists, in case that changes.
  "+$HOME/.local/share/claude/",
  "?$DATA/claude",
]

[macos]
ro = ["$HOME/Library/Preferences"]
